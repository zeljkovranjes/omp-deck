services:
  omp-deck:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OMP_DECK_BASE_PATH: /agents/omp
    image: local/omp-deck:0.6.1-sys
    container_name: omp-deck
    restart: unless-stopped
    init: true
    user: "1000:1000"
    ports:
      - "127.0.0.1:8788:8787"
      # OpenAI's registered Codex callback is fixed to localhost:1455. Keep
      # this host-side loopback-only; clients reach it through an SSH tunnel.
      - "127.0.0.1:1455:1455"
    networks:
      - sys-gateway
    environment:
      OMP_DECK_HOST: "0.0.0.0"
      OMP_DECK_PORT: "8787"
      OMP_DECK_WEB_DIST: "/app/apps/web/dist"
      OMP_DECK_DEFAULT_CWD: "/workspace"
      OMP_DECK_WORKSPACES: "/workspace"
      OMP_AGENT_DIR: "/home/bun/.omp/agent"
      OMP_DECK_DATA_DIR: "/data/omp-deck"
      OMP_DECK_DB_PATH: "/data/omp-deck/deck.db"
      OMP_DECK_UPLOADS_ROOT: "/data/omp-deck/uploads"
      NODE_ENV: "production"
      LOG_LEVEL: "info"
      OMP_DECK_OAUTH_BIND_HOST: "0.0.0.0"
    volumes:
      - /srv/docker-data/omp-deck/data:/data/omp-deck
      - /srv/docker-data/omp-deck/sdk-state:/home/bun/.omp
      - /srv/docker-data/omp-deck/kb:/home/bun/kb
      - /srv/docker-data/omp-deck/workspace:/workspace
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    stop_signal: SIGTERM
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:8787/api/health');if(!r.ok)process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  sys-gateway:
    external: true
    name: sys-gateway_default
